# Royal Wellness CRM — Quality Gates CI
#
# Runs on every push to main and on every PR.
# These checks are ADVISORY/BLOCKING quality gates — they never auto-deploy.
# Production deployment is handled exclusively by Render's own build pipeline
# triggered from the main branch. This workflow does NOT touch production.
#
# Required GitHub Actions secrets (Settings -> Secrets and variables -> Actions):
#   None are needed for these quality gates.
#   All deployment secrets (DATABASE_URL, META_ACCESS_TOKEN, etc.) live ONLY
#   in Render's environment dashboard and must NEVER appear in this file.

name: Quality Gates

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "chore/**"
  pull_request:
    branches:
      - main

# Least-privilege permissions
permissions:
  contents: read
  checks: write
  pull-requests: write

# Cancel stale runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────
  # JOB 1  Frontend — TypeScript type-check, oxlint, Vite build
  #
  # This is an npm workspaces monorepo. The root package-lock.json
  # covers all workspaces. There is no frontend/package-lock.json.
  # Install is done from the repo root using --workspace=frontend.
  # ──────────────────────────────────────────────────────────
  frontend:
    name: "Frontend - Type-check, Lint, Build"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin to Node 24 - same major version used in local dev.
      # Cache key uses root package-lock.json (the only lockfile for all workspaces).
      # There is no frontend/package-lock.json - this monorepo uses a single root lockfile.
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Install frontend workspace deps from repo root using the root lockfile.
      - name: Install frontend workspace dependencies
        run: npm ci --workspace=frontend --ignore-scripts

      # tsc -b honours tsconfig.json -> tsconfig.app.json (noEmit:true).
      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc -b --noEmit

      # oxlint config is at frontend/.oxlintrc.json
      # 212 known warnings exist, 0 errors - errors block the build.
      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint
        continue-on-error: false

      # Vite production build validates imports and TypeScript compilation.
      - name: Production build (Vite)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "https://ci-build-check.invalid"

      # Store dist artifact for download without re-running.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error


  # ──────────────────────────────────────────────────────────
  # JOB 2  Backend — Prisma generate + 37-test security suite
  #
  # Backend has its own backend/package-lock.json and can be
  # installed independently from within the backend directory.
  # ──────────────────────────────────────────────────────────
  backend:
    name: "Backend - Prisma Generate, Security Tests"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # Install backend deps using its own lockfile (backend/package-lock.json exists).
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_stub"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci_stub"

      # prisma generate only needs a syntactically valid DATABASE_URL string.
      # It does NOT open a real database connection during code generation.
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_stub"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci_stub"

      # Full test suite - all 37 tests must pass (exit 0).
      # Covers: Meta token security, bell notifications, sender audit,
      #         RBAC/auth, login credential security, rate-limiting.
      - name: Run security and auth test suite
        working-directory: backend
        run: |
          node test-meta-token-security.js
          node test-bell-notification.js
          node test-sender-audit.js
          node test-auth-security.js
          node test-login-security.js
        env:
          # Stub values - tests import server.js which reads process.env.
          # These are non-secret CI placeholders, not real credentials.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_stub"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci_stub"
          JWT_SECRET: "ci-placeholder-jwt-secret"
          META_ACCESS_TOKEN: "ci-placeholder-meta-token"
          META_VERIFY_TOKEN: "ci-placeholder-verify-token"
          META_PHONE_NUMBER_ID: "000000000000000"
          META_PHONE_NUMBER_ID_RWC: "000000000000001"
          META_PHONE_NUMBER_ID_CRAS: "000000000000002"
          FRONTEND_URL: "http://localhost:5173"
          PORT: "3001"
          NODE_ENV: "test"


  # ──────────────────────────────────────────────────────────
  # JOB 3  Dependency audit - advisory, never auto-upgrades
  # Known high/moderate findings are documented and non-blocking.
  # Only CRITICAL CVEs hard-fail this job.
  # ──────────────────────────────────────────────────────────
  audit:
    name: "Dependency Audit (Advisory)"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Root workspace audit (contains root package-lock.json)
      - name: Audit root workspace
        run: npm audit --audit-level=critical || true

      # Backend workspace audit
      - name: Audit backend
        working-directory: backend
        run: npm audit --audit-level=critical || true

      # Frontend may lack its own lockfile (workspace hoisting).
      # Generate one on-the-fly for audit only.
      - name: Audit frontend
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts 2>&1
          fi
          npm audit --audit-level=critical || true

      - name: Write audit summary
        if: always()
        run: |
          {
            echo "## Dependency Audit Summary"
            echo ""
            echo "Audit level: **critical** (blocks CI) | High/Moderate findings documented below."
            echo ""
            echo "### Known non-blocking vulnerabilities"
            echo ""
            echo "| Package | Via | Severity | Advisory | Safe Remediation |"
            echo "|---------|-----|----------|----------|-----------------|"
            echo "| braces | tailwindcss@3 | High | GHSA-vfj7-8cjw-p6xm | Migrate to tailwindcss v4 (breaking change) |"
            echo "| micromatch | tailwindcss@3 | High | GHSA-vfj7-8cjw-p6xm | Same as above |"
            echo "| postcss-selector-parser | tailwindcss@3 | Moderate | GHSA-rj75-hqrm-r3gf | tailwindcss v4 migration |"
            echo "| deepmerge-ts | @prisma/config | High | GHSA-ggr8-5vv4-36mx | Upgrade prisma to >= 8.2.0 when stable |"
            echo ""
            echo "> All findings are in build-tool devDependencies and do not affect the production runtime."
          } >> "$GITHUB_STEP_SUMMARY"


  # ──────────────────────────────────────────────────────────
  # JOB 4  Secret leak scan
  # Hard-fails only if live API tokens or DB passwords are found
  # in git-tracked JS/TS SOURCE files (not in .env, which is gitignored).
  # ──────────────────────────────────────────────────────────
  secret-scan:
    name: "Secret Leak Scan"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          FAIL=0

          echo "Scanning JS/TS source files for live Meta Graph API tokens..."
          # Live Meta tokens start with EAAP followed by 30+ alphanumeric chars.
          # Scope: only JS/TS source files. Not .env.example or CI docs.
          MATCH=$(git ls-files -- "*.js" "*.ts" | \
            xargs grep -lE "EAAP[a-zA-Z0-9]{30,}" 2>/dev/null || true)
          if [ -n "$MATCH" ]; then
            echo "::error::Live Meta Graph API token found in tracked source file: $MATCH"
            FAIL=1
          else
            echo "OK: No live Meta tokens found in JS/TS source files."
          fi

          echo "Scanning JS/TS/JSON source files for hardcoded database passwords..."
          # Looks for postgresql:// URLs with a real password embedded.
          # .env is gitignored; .env.example has only placeholders (checked separately).
          DBMATCH=$(git ls-files -- "*.js" "*.ts" "*.json" | \
            xargs grep -lE "postgresql://[^:]+:[^@]{8,}@" 2>/dev/null || true)
          if [ -n "$DBMATCH" ]; then
            echo "::error::Hardcoded database URL with password found: $DBMATCH"
            FAIL=1
          else
            echo "OK: No hardcoded database credentials found in source files."
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Secret scan failed. Remove secrets and rotate exposed credentials."
            exit 1
          fi
          echo "Secret scan passed - no leaked credentials detected in tracked source files."
