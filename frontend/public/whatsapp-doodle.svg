    <path d="M175 175c0-13 11-23 24-23s24 10 24 23z"/>
    <path d="M199 152v32c0 3-2 5-5 5s-4-2-4-4"/>
    <path d="M175 175c4-3 8-3 12 0 4-3 8-3 12 0 4-3 8-3 12 0 4-3 8-3 12 0"/>

    <!-- Thumbs up -->
    <path d="M270 175v16h6l8-2 2-6v-8h-11l2-7c0-3-2-5-4-5l-3 4-2 8z"/>
    <rect x="264" y="175" width="6" height="16" rx="1"/>

    <!-- Sun & Cloud -->
    <path d="M338 170a7 7 0 0 1 13-3 6 6 0 0 1 9 5 5 5 0 0 1-1 10h-20a5 5 0 0 1-1-12z"/>
    <path d="M342 155l1 3"/>
    <path d="M355 157l-1 3"/>
    <path d="M333 162l3 1"/>

    <!-- Row 4: y: 220-270 -->
    <!-- Flower / Daisy -->
    <circle cx="45" cy="245" r="4"/>
    <circle cx="45" cy="236" r="3"/>
    <circle cx="53" cy="241" r="3"/>
    <circle cx="51" cy="250" r="3"/>
    <circle cx="39" cy="250" r="3"/>
    <circle cx="37" cy="241" r="3"/>
    <path d="M45 252v12"/>

