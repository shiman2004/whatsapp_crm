    <circle cx="185" cy="242" r="7"/>
    <path d="M192 242h22v5h-4v-5h-4v4h-3v-4"/>

    <!-- Glasses / Spectacles -->
    <circle cx="265" cy="245" r="9"/>
    <circle cx="295" cy="245" r="9"/>
    <path d="M274 245h12"/>
    <path d="M256 242l-8-5"/>
    <path d="M304 242l8-5"/>

    <!-- Gift box -->
    <rect x="340" y="235" width="26" height="24" rx="2"/>
    <path d="M337 230h32v6h-32z"/>
    <line x1="353" y1="236" x2="353" y2="259"/>
    <path d="M353 230c-3-5-8-5-8-2s5 2 8 2z"/>
    <path d="M353 230c3-5 8-5 8-2s-5 2-8 2z"/>

    <!-- Row 5: y: 290-340 -->
    <!-- Game controller -->
    <rect x="25" y="302" width="36" height="22" rx="7"/>
    <path d="M34 309v8m-4-4h8"/>
    <circle cx="50" cy="311" r="1.5" fill="currentColor"/>
    <circle cx="54" cy="315" r="1.5" fill="currentColor"/>

    <!-- Lock -->
    <rect x="102" y="308" width="22" height="18" rx="3"/>
    <path d="M107 308v-6c0-3 3-6 6-6s6 3 6 6v6"/>
    <circle cx="113" cy="316" r="2" fill="currentColor"/>

    <!-- Bicycle -->
    <circle cx="182" cy="318" r="9"/>
    <circle cx="214" cy="318" r="9"/>
    <path d="M182 318l12-14h10l10 14m-10-14v-4h-5m-5 4l-4 14"/>

    <!-- Trophy / Medal -->
    <path d="M265 300h24v12c0 6-5 11-12 11s-12-5-12-11v-12z"/>
    <path d="M265 304h-6c-2 0-4 2-4 4s2 4 4 4h6"/>
    <path d="M289 304h6c2 0 4 2 4 4s-2 4-4 4h-6"/>
    <path d="M277 323v7m-7 0h14"/>

    <!-- Audio waveform -->
    <line x1="340" y1="315" x2="340" y2="325"/>
    <line x1="345" y1="308" x2="345" y2="332"/>
    <line x1="350" y1="302" x2="350" y2="338"/>
    <line x1="355" y1="310" x2="355" y2="330"/>
    <line x1="360" y1="317" x2="360" y2="323"/>

    <!-- Row 6: y: 360-395 (seamless bottom-to-top transition) -->
    <!-- Sparkles -->
    <path d="M45 365l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M60 380l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/>

    <!-- Pizza slice -->
    <path d="M115 365l18 24-24 5 6-29z"/>
    <path d="M110 393c8-2 15-3 23-4"/>
    <circle cx="118" cy="378" r="1.5" fill="currentColor"/>
    <circle cx="122" cy="385" r="1.5" fill="currentColor"/>

    <!-- Leaf / Plant -->
    <path d="M190 395c0-12 10-20 20-20 0 10-8 20-20 20z"/>
    <path d="M190 395c5-8 12-12 20-20"/>

    <!-- Tag -->
    <path d="M265 370h12l10 10-10 10h-12z"/>
    <circle cx="270" cy="380" r="1.5" fill="currentColor"/>

    <!-- Megaphone -->
    <path d="M342 370l16-6v24l-16-6h-6v-12h6z"/>
    <path d="M346 382l2 8h-4l-2-8"/>

  </g>
</svg>
