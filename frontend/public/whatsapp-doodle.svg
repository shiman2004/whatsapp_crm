<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- WhatsApp Web Authentic Subtle Line-Art Doodle Wallpaper -->
  <g opacity="0.05" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Row 1: y: 20-70 -->
    <!-- Speech bubble -->
    <path d="M25 35c0-8.3 6.7-15 15-15h18c8.3 0 15 6.7 15 15v8c0 8.3-6.7 15-15 15h-10l-10 8v-8c-4.4 0-8-3.6-8-8v-7z"/>
    <circle cx="44" cy="39" r="1.5" fill="currentColor"/>
    <circle cx="53" cy="39" r="1.5" fill="currentColor"/>
    <circle cx="62" cy="39" r="1.5" fill="currentColor"/>

    <!-- Coffee cup -->
    <path d="M125 32h26v20c0 5-4 9-9 9h-8c-5 0-9-4-9-9V32z"/>
    <path d="M151 36h5c3 0 5 2 5 5s-2 5-5 5h-5"/>
    <path d="M122 65h32"/>
    <path d="M133 24c0-3 2-4 2-6"/>
    <path d="M141 24c0-3 2-4 2-6"/>

    <!-- Music note -->
    <path d="M208 48v-22l20-4v22"/>
    <circle cx="203" cy="50" r="5"/>
    <circle cx="223" cy="46" r="5"/>
    <path d="M208 34l20-4"/>

    <!-- Heart -->
    <path d="M285 30c-4-4-10-4-14 0l-2 2-2-2c-4-4-10-4-14 0-4 4-4 10 0 14l16 16 16-16c4-4 4-10 0-14z"/>

    <!-- Clock -->
    <circle cx="350" cy="40" r="16"/>
    <path d="M350 28v12l8 5"/>

    <!-- Row 2: y: 80-130 -->
    <!-- Camera -->
    <rect x="25" y="90" width="34" height="24" rx="4"/>
    <circle cx="42" cy="102" r="6"/>
    <path d="M33 90l3-5h12l3 5"/>
    <circle cx="52" cy="95" r="1" fill="currentColor"/>

    <!-- Smiley face -->
    <circle cx="115" cy="105" r="16"/>
    <circle cx="110" cy="100" r="1.5" fill="currentColor"/>
    <circle cx="120" cy="100" r="1.5" fill="currentColor"/>
    <path d="M109 111c2 3 5 4 6 4s4-1 6-4"/>

    <!-- Paper plane -->
    <path d="M185 105l32-15-12 28-6-7-14-6z"/>
    <path d="M199 111l18-21"/>

    <!-- Headphones -->
    <path d="M260 115v-10c0-10 8-18 18-18s18 8 18 18v10"/>
    <rect x="256" y="112" width="7" height="13" rx="3.5"/>
    <rect x="291" y="112" width="7" height="13" rx="3.5"/>

    <!-- Star -->
    <path d="M355 90l3.5 7 7.5 1-5.5 5.5 1.5 7.5-7-3.5-7 3.5 1.5-7.5-5.5-5.5 7.5-1z"/>

    <!-- Row 3: y: 150-200 -->
    <!-- Lightbulb -->
    <path d="M40 160c-7 0-13 6-13 13 0 4 2 8 5 11l2 7h12l2-7c3-3 5-7 5-11 0-7-6-13-13-13z"/>
    <path d="M35 194h10"/>
    <path d="M37 197h6"/>

    <!-- Smartphone -->
    <rect x="100" y="155" width="22" height="38" rx="4"/>
    <line x1="107" y1="159" x2="115" y2="159"/>
    <circle cx="111" cy="186" r="1.5" fill="currentColor"/>

